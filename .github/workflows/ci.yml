name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Test Python syntax
        run: python -m py_compile app/app.py

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:latest \
            .
            . 

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:latest


      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}

            docker rm -f devops-app || true

            docker run -d \
              --name devops-app \
              --restart unless-stopped \
              -p 80:5000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}